name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            python3 python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-3.0 gir1.2-xapp-1.0 python3-xapp \
            gettext libglib2.0-bin desktop-file-utils xvfb xauth dbus-x11 \
            cinnamon-desktop-data librsvg2-common shared-mime-info at-spi2-core \
            dpkg-dev lintian
      - name: Validate schemas and translations
        run: |
          glib-compile-schemas --strict --dry-run data
          msgfmt --check src/cannelia_capture/po/pt_BR.po -o /tmp/cannelia-pt_BR.mo
          git diff --check
      - name: Run regression tests on a virtual display
        env:
          LANGUAGE: pt_BR
          GSETTINGS_BACKEND: memory
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test-screenshot-local.py
      - name: Build and validate reproducible Debian package
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test-deb.py
